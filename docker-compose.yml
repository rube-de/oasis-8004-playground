# ERC-8004 Agents - Root Docker Compose
# Runs both agent-client and agent-server together

services:
  agent-client:
    build:
      context: .
      dockerfile: agent-client/Dockerfile
    platform: linux/amd64
    image: ghcr.io/rube-de/agent-client:latest
    container_name: erc8004-agent-client

    # Load environment variables from agent-client/.env
    env_file:
      - agent-client/.env

    # Expose API server port (map internal 80 to host 8000)
    ports:
      - "8000:80"

    # Docker network configuration
    networks:
      erc8004-network:
        aliases:
          - agent.localhost
          - agent-client

    # Restart policy for long-running container
    restart: unless-stopped

    # Health check configuration (HTTP-based via API server on port 80)
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent-server:
    build:
      context: .
      dockerfile: agent-server/Dockerfile
    platform: linux/amd64
    image: ghcr.io/rube-de/agent-server:latest
    container_name: erc8004-agent-server

    # Load environment variables from agent-server/.env
    env_file:
      - agent-server/.env

    # Expose API server port (map internal 80 to host 8001)
    ports:
      - "8001:80"

    # Docker network configuration
    networks:
      erc8004-network:
        aliases:
          - server.localhost
          - agent-server

    # Restart policy for long-running container
    restart: unless-stopped

    # Health check configuration (HTTP-based via API server on port 80)
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Define shared network for agent communication
networks:
  erc8004-network:
    driver: bridge
