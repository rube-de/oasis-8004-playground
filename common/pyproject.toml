[project]
name = "erc8004-common"
version = "0.1.0"
description = "Shared ERC-8004 infrastructure (plugins, utilities, config)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "web3>=7.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "eth-account>=0.11.0",
    "eth-utils>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
