services:
  agent-client:
    build:
      # Build context is parent directory to access contracts
      context: ..
      dockerfile: agent-client/Dockerfile
    platform: linux/amd64
    image: ghcr.io/rube-de/agent-client:latest
    container_name: erc8004-agent-client

    # Load environment variables from .env file
    env_file:
      - .env

    # Restart policy for long-running container
    restart: unless-stopped

    # Health check configuration
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import src.main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"