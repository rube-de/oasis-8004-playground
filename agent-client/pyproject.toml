[project]
name = "agent-client"
version = "0.1.0"
description = "ERC-8004 Identity Registry agent client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "erc8004-common",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "oasis-rofl-client>=0.1.4",
]

[project.scripts]
agent-client = "src.main:main"

[tool.uv.sources]
erc8004-common = { path = "./common", editable = true }
